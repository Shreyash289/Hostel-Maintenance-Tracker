# Run all three containers with:  podman compose up -d --build
# (Works with podman-compose and with docker compose too.)
name: hmt

services:
  mongo:
    image: docker.io/library/mongo:7
    container_name: hmt-mongo
    restart: unless-stopped
    networks: [hmt-net]
    volumes:
      - mongo-data:/data/db        # <- named volume: requests survive container restarts/rebuilds
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no "ports:" -> MongoDB is reachable only from inside hmt-net, not from the host

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: localhost/hmt-backend:1.0
    container_name: hmt-backend
    restart: unless-stopped
    networks: [hmt-net]
    environment:
      MONGO_URI: mongodb://mongo:27017/hostel_maintenance
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-this-hostel-secret}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"                # host:container

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: localhost/hmt-frontend:1.0
    container_name: hmt-frontend
    restart: unless-stopped
    networks: [hmt-net]
    depends_on:
      - backend
    ports:
      - "3000:80"                  # open http://localhost:3000

networks:
  hmt-net:
    name: hmt-net                  # user-defined bridge network; containers find each other by name

volumes:
  mongo-data:
    name: hmt-mongo-data
