services:
  mongo:
    image: mongo:7
    container_name: hmt-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db        # <- named volume: requests survive container restarts/rebuilds
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hmt-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/hostel_maintenance
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-this-hostel-secret}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: hmt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
